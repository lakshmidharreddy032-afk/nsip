version: 2
updates:
  - { package-ecosystem: pip, directory: /services/core-api, schedule: { interval: weekly } }
  - { package-ecosystem: pip, directory: /services/auth-service, schedule: { interval: weekly } }
  - { package-ecosystem: npm, directory: /, schedule: { interval: weekly }, open-pull-requests-limit: 10 }
  - { package-ecosystem: docker, directory: /services/core-api, schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: /services/auth-service, schedule: { interval: weekly } }
  - { package-ecosystem: github-actions, directory: /, schedule: { interval: monthly } }
