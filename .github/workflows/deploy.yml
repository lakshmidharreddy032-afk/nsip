name: deploy
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
    inputs:
      environment: { type: choice, options: [staging, production], default: staging }
permissions: { contents: read, id-token: write, packages: write }

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: core-api, context: ., file: services/core-api/Dockerfile }
          - { name: auth-service, context: services/auth-service, file: services/auth-service/Dockerfile }
          - { name: workbench-web, context: ., file: apps/workbench-web/Dockerfile }
          - { name: auth-web, context: ., file: apps/auth-web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: "${{ vars.REGISTRY }}", username: "${{ secrets.REGISTRY_USER }}", password: "${{ secrets.REGISTRY_TOKEN }}" }
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: true
          sbom: true
          tags: ${{ vars.REGISTRY }}/nsip/${{ matrix.name }}:${{ github.ref_name }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}   # production requires manual approval in GitHub environments
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: azure/k8s-set-context@v4
        with: { method: kubeconfig, kubeconfig: "${{ secrets.KUBECONFIG }}" }
      - run: kubectl apply -f infra/k8s/namespace.yaml
      - run: >
          helm upgrade --install nsip infra/helm/nsip -n nsip --atomic --timeout 10m
          --set global.imageTag=${{ github.ref_name }} --set global.imageRegistry=${{ vars.REGISTRY }}/nsip
      - run: kubectl -n nsip rollout status deploy/nsip-core-api --timeout=5m
