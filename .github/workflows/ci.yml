name: ci
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy: { matrix: { service: [auth-service, core-api] } }
    services:
      postgres:
        image: postgres:16.4-alpine
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s
    defaults: { run: { working-directory: "services/${{ matrix.service }}"} }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: mypy app
      - run: pytest --cov=app --cov-report=xml --cov-fail-under=85
      - name: Migrations apply on PostgreSQL 16
        if: matrix.service == 'core-api'
        env: { NSIP_DATABASE_URL: "postgresql+psycopg://postgres:ci@localhost:5432/ci" }
        run: alembic upgrade head
      - uses: actions/upload-artifact@v4
        with: { name: "coverage-${{ matrix.service }}", path: "services/${{ matrix.service }}/coverage.xml"}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  eval:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e "services/core-api[dev]"
      - run: python eval/synthetic/generate.py --out eval/datasets/default --count 300 --seed 7
      - name: Acceptance gates (spec section 15)
        run: PYTHONPATH=services/core-api python eval/run_eval.py --dataset eval/datasets/default
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: eval/reports/ }

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose up --build -d
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm install && npx playwright install --with-deps chromium
        working-directory: apps/workbench-web
      - run: npx wait-on -t 600000 http://localhost:8080/api/health && npx playwright test
        working-directory: apps/workbench-web
        env: { E2E_BASE_URL: "http://localhost:8080" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: apps/workbench-web/playwright-report }
      - name: Lighthouse accessibility >= 95
        run: npx @lhci/cli@0.14.0 autorun --collect.url=http://localhost:8080/login/ --assert.assertions.categories:accessibility="error;minScore=0.95"
