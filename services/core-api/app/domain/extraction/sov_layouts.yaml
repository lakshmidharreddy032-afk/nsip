# Known broker SOV layouts (format-fingerprint library). Columns: [header, field, unit_multiplier].
# Deterministic mapping applies when the normalised header fingerprint matches exactly.
layouts:
  - id: L01-marsh-std
    broker: Marsh-style standard
    columns: [["Loc No", loc_no, 1], ["Address", address, 1], ["City", city, 1], ["Pincode", pincode, 1], ["Occupancy", occupancy, 1], ["Construction", construction, 1], ["Year Built", year_built, 1], ["Building", building, 1], ["Plant & Machinery", plant_machinery, 1], ["Stock", stock, 1], ["Contents", contents, 1], ["Other", other, 1], ["Total", total, 1]]
  - id: L02-aon-lakh
    broker: Aon-style values in lakh
    columns: [["Sr", loc_no, 1], ["Risk Location", address, 1], ["Town", city, 1], ["PIN", pincode, 1], ["Trade", occupancy, 1], ["Const Type", construction, 1], ["YOB", year_built, 1], ["Bldg (Rs lakh)", building, 100000], ["P&M (Rs lakh)", plant_machinery, 100000], ["Stocks (Rs lakh)", stock, 100000], ["FFF (Rs lakh)", contents, 100000], ["Total (Rs lakh)", total, 100000]]
  - id: L03-howden-cr
    broker: Howden-style values in crore
    columns: [["Location #", loc_no, 1], ["Premises Address", address, 1], ["City", city, 1], ["Postal Code", pincode, 1], ["Nature of Business", occupancy, 1], ["Building Construction", construction, 1], ["Year of Construction", year_built, 1], ["Building SI (Cr)", building, 10000000], ["Machinery SI (Cr)", plant_machinery, 10000000], ["Stock SI (Cr)", stock, 10000000], ["Total SI (Cr)", total, 10000000]]
