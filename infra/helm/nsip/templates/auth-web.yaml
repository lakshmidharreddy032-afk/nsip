{{- $root := . -}}
# auth-service: separate deployment unit, separate secret, separate DB schema.
apiVersion: apps/v1
kind: Deployment
metadata: { name: nsip-auth-service, labels: { app: nsip-auth-service } }
spec:
  replicas: {{ .Values.authService.replicas }}
  selector: { matchLabels: { app: nsip-auth-service } }
  template:
    metadata:
      labels: { app: nsip-auth-service }
      annotations: { prometheus.io/scrape: "true", prometheus.io/path: /auth/metrics, prometheus.io/port: "8001" }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: auth-service
          image: {{ include "nsip.image" (dict "root" $root "name" "auth-service") }}
          ports: [{ containerPort: 8001 }]
          envFrom: [{ secretRef: { name: {{ .Values.externalSecrets.authSecretName }} } }]
          env:
            {{- range $k, $v := .Values.authService.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          readinessProbe: { httpGet: { path: /auth/health, port: 8001 } }
          resources: {{- toYaml .Values.authService.resources | nindent 12 }}
          {{- include "nsip.securityContext" . | nindent 10 }}
          volumeMounts: [{ name: var, mountPath: /srv/var }, { name: tmp, mountPath: /tmp }]
      volumes: [{ name: var, emptyDir: {} }, { name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: nsip-auth-service }
spec: { selector: { app: nsip-auth-service }, ports: [{ port: 8001, targetPort: 8001 }] }
{{- range $name, $cfg := dict "workbench-web" .Values.workbenchWeb "auth-web" .Values.authWeb }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nsip-{{ $name }} }
spec:
  replicas: {{ $cfg.replicas }}
  selector: { matchLabels: { app: nsip-{{ $name }} } }
  template:
    metadata: { labels: { app: nsip-{{ $name }} } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: {{ include "nsip.image" (dict "root" $root "name" $name) }}
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: 8080 } }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Service
metadata: { name: nsip-{{ $name }} }
spec: { selector: { app: nsip-{{ $name }} }, ports: [{ port: 8080, targetPort: 8080 }] }
{{- end }}
{{- if .Values.clamav.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nsip-clamav }
spec:
  replicas: 1
  selector: { matchLabels: { app: nsip-clamav } }
  template:
    metadata: { labels: { app: nsip-clamav } }
    spec:
      containers: [{ name: clamav, image: "clamav/clamav:1.4", ports: [{ containerPort: 3310 }], resources: { requests: { memory: 2Gi } } }]
---
apiVersion: v1
kind: Service
metadata: { name: nsip-clamav }
spec: { selector: { app: nsip-clamav }, ports: [{ port: 3310 }] }
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nsip
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls: [{ hosts: [{{ .Values.global.host }}], secretName: {{ .Values.global.tlsSecret }} }]
  rules:
    - host: {{ .Values.global.host }}
      http:
        paths:
          - { path: /auth, pathType: Prefix, backend: { service: { name: nsip-auth-service, port: { number: 8001 } } } }
          - { path: /.well-known, pathType: Prefix, backend: { service: { name: nsip-auth-service, port: { number: 8001 } } } }
          - { path: /api, pathType: Prefix, backend: { service: { name: nsip-core-api, port: { number: 8000 } } } }
          - { path: /login, pathType: Prefix, backend: { service: { name: nsip-auth-web, port: { number: 8080 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: nsip-workbench-web, port: { number: 8080 } } } }
