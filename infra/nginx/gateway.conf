# Edge gateway for local/compose: one origin so SameSite=Strict cookies and strict CORS work.
#   /login/*  -> auth-web (separate login application)
#   /auth/*   -> auth-service (separate service, own schema)
#   /api/*    -> core-api
#   /*        -> workbench-web
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 8080;
  server_tokens off;
  client_max_body_size 55m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

  location /auth/ {
    limit_req zone=auth burst=20 nodelay;
    proxy_pass http://auth-service:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /.well-known/jwks.json { proxy_pass http://auth-service:8001; }

  location /api/v1/events {
    proxy_pass http://core-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location /api/ {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://core-api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  location /login/ { proxy_pass http://auth-web:8080; }
  location / { proxy_pass http://workbench-web:8080; }
}
