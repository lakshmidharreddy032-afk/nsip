groups:
  - name: nsip-slo
    rules:
      - record: nsip:workbench_read_latency_p95
        expr: histogram_quantile(0.95, sum by (le) (rate(nsip_http_request_seconds_bucket{method="GET",route=~"/api/v1/submissions.*"}[5m])))
      - alert: WorkbenchReadLatencyHigh
        expr: nsip:workbench_read_latency_p95 > 0.3
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "p95 workbench read latency above 300 ms", runbook: "docs/runbooks/performance.md" }
      - alert: ApiErrorRateHigh
        expr: sum(rate(nsip_http_requests_total{status=~"5.."}[5m])) / sum(rate(nsip_http_requests_total[5m])) > 0.02
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "5xx rate above 2%" }
      - alert: AuthBruteForce
        expr: sum(rate(nsip_auth_requests_total{path="/auth/login",status=~"401|423|429"}[5m])) > 2
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Elevated failed sign-ins; check auth audit log" }
  - name: nsip-pipeline
    rules:
      - alert: PipelineQueueBacklog
        expr: sum(redis_key_size{key="pipeline"}) > 200
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Pipeline backlog above 200 (KEDA should be scaling workers)" }
      - alert: GatewayOutageManualQueue
        expr: sum(rate(nsip_ai_calls_total{status!="ok"}[10m])) / clamp_min(sum(rate(nsip_ai_calls_total[10m])), 1e-9) > 0.5
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "AI gateway failing; submissions falling back to the manual queue", runbook: "docs/runbooks/gateway-outage.md" }
      - alert: InvalidModelOutputSpike
        expr: sum(rate(nsip_ai_calls_total{status="invalid_output"}[30m])) > 0.05
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Model outputs failing schema validation; check gateway model version" }
