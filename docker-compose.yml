# Local full stack: `docker compose up --build` then open http://localhost:8080 (demo users in README).
name: nsip

x-core-env: &core-env
  NSIP_ENV: dev
  NSIP_DATABASE_URL: postgresql+psycopg://nsip:${POSTGRES_PASSWORD:-nsip-dev}@postgres:5432/nsip
  NSIP_REDIS_URL: redis://redis:6379/0
  NSIP_TASKS_EAGER: "false"
  NSIP_AUTH_JWKS_URL: http://auth-service:8001/.well-known/jwks.json
  NSIP_AUTH_SERVICE_URL: http://auth-service:8001
  NSIP_INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
  AI_GATEWAY_URL: http://mock-gateway:8090
  NSIP_AI_GATEWAY_MODE: http
  NSIP_OBJECT_STORE: s3
  NSIP_S3_ENDPOINT: http://minio:9000
  NSIP_S3_BUCKET: nsip-originals
  NSIP_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-nsip}
  NSIP_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-nsip-dev-secret}
  NSIP_ANTIVIRUS: clamav
  NSIP_CLAMAV_HOST: clamav
  NSIP_MAILBOX_DIR: /data/mailbox
  NSIP_OUTBOX_DIR: /data/outbox
  NSIP_CORS_ORIGINS: '["http://localhost:8080"]'

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: nsip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nsip-dev}
      POSTGRES_DB: nsip
    volumes: [pgdata:/var/lib/postgresql/data, ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nsip"], interval: 5s, retries: 20 }

  redis:
    image: redis:7.4-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: "${MINIO_ROOT_USER:-nsip}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-nsip-dev-secret}" }
    volumes: [minio:/data]
    ports: ["9001:9001"]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, retries: 20 }

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: ["sh", "-c", "mc alias set l http://minio:9000 $${U} $${P} && mc mb -p l/nsip-originals && mc encrypt set sse-s3 l/nsip-originals || true"]
    environment: { U: "${MINIO_ROOT_USER:-nsip}", P: "${MINIO_ROOT_PASSWORD:-nsip-dev-secret}" }

  clamav:
    image: clamav/clamav:1.4
    healthcheck: { test: ["CMD", "clamdcheck.sh"], interval: 30s, retries: 20, start_period: 120s }

  mock-gateway:
    build: { context: services/mock-gateway }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/health')"], interval: 10s }

  auth-service:
    build: { context: services/auth-service }
    environment:
      AUTH_DATABASE_URL: postgresql+psycopg://nsip:${POSTGRES_PASSWORD:-nsip-dev}@postgres:5432/nsip_auth
      AUTH_DB_SCHEMA: auth
      AUTH_COOKIE_SECURE: "true"
      AUTH_RESET_SECRET: ${AUTH_RESET_SECRET:-dev-only-reset-secret-change-me}
      AUTH_INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      AUTH_APP_BASE_URL: http://localhost:8080
      AUTH_CORS_ORIGINS: '["http://localhost:8080"]'
    volumes: [authkeys:/srv/var]
    depends_on: { postgres: { condition: service_healthy } }

  core-api:
    build: { context: ., dockerfile: services/core-api/Dockerfile }
    environment: *core-env
    volumes: [data:/data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      auth-service: { condition: service_healthy }
      mock-gateway: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: services/core-api/Dockerfile }
    command: ["celery", "-A", "app.workers.tasks:celery_app", "worker", "-Q", "ingest,pipeline,maintenance", "-B", "--loglevel=INFO", "--concurrency=4"]
    environment: *core-env
    volumes: [data:/data]
    depends_on: { core-api: { condition: service_healthy } }
    healthcheck: { disable: true }

  seed-auth:
    build: { context: services/auth-service }
    command: ["python", "-m", "app.seed"]
    environment:
      AUTH_DATABASE_URL: postgresql+psycopg://nsip:${POSTGRES_PASSWORD:-nsip-dev}@postgres:5432/nsip_auth
      AUTH_DB_SCHEMA: auth
    volumes: [authkeys:/srv/var]
    depends_on: { auth-service: { condition: service_healthy } }
    restart: "no"
    healthcheck: { disable: true }

  seed:
    build: { context: ., dockerfile: services/core-api/Dockerfile }
    command: ["python", "/srv/scripts/seed.py", "--only", "core", "--with-data"]
    environment: *core-env
    volumes: [data:/data]
    depends_on:
      core-api: { condition: service_healthy }
      seed-auth: { condition: service_completed_successfully }
    restart: "no"
    healthcheck: { disable: true }

  auth-web:
    build: { context: ., dockerfile: apps/auth-web/Dockerfile }

  workbench-web:
    build: { context: ., dockerfile: apps/workbench-web/Dockerfile }

  gateway:
    image: nginx:1.27-alpine
    volumes: [./infra/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: ["8080:8080"]
    depends_on: [core-api, auth-service, auth-web, workbench-web]

volumes: { pgdata: {}, minio: {}, data: {}, authkeys: {} }
