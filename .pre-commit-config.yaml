repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^infra/helm/
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^services/core-api/app/adapters/rating_models/
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: architecture-boundaries
        name: AI layer must not import quoting
        entry: python -c "import sys,pathlib;sys.path.insert(0,'services/core-api');from tests_architecture_scan import scan_ai_imports as s;v=s(pathlib.Path('services/core-api/app'));print(v);sys.exit(1 if v else 0)"
        language: system
        pass_filenames: false
        files: ^services/core-api/app/
